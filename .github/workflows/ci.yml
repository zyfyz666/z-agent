name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The application includes Windows-only runtime dependencies. Test on
      # the supported OS and install the exact committed dependency graph.
      # Skip unrelated native lifecycle builds, then install Electron explicitly:
      # browser observation and memory worker tests exercise the real runtime.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Electron runtime for tests
        run: node node_modules/electron/install.js
      - run: npm test
