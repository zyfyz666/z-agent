<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>Z · 快速输入</title>
  <link rel="icon" href="../assets/z-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="quick-input.css" />
</head>
<body>
  <main class="quick-input-shell">
    <div class="quick-input-pill" role="dialog" aria-label="Z 快速输入">
      <span class="quick-input-drag-mark" aria-hidden="true">
        <img src="../assets/z-mark.svg" alt="" draggable="false" />
      </span>
      <input id="quickInput" type="text" autocomplete="off" spellcheck="false" placeholder="交给 Z，从一个目标开始。" aria-label="输入需求" />
      <button id="quickSubmit" type="button" aria-label="提交需求" title="提交需求">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </div>
  </main>
  <script src="../i18n.js"></script>
  <script src="quick-input.js"></script>
</body>
</html>
